<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QuickCalc — Percentage Calculator</title>
  <style>
    body {
      font-family: -apple-system, sans-serif;
      max-width: 500px;
      margin: 60px auto;
      padding: 0 20px;
      background: #F4F2EC;
      color: #1B1F27;
    }

    h1 {
      margin-bottom: 4px;
    }

    .calculator {
      background: white;
      border: 1px solid #DCD8CE;
      border-radius: 8px;
      padding: 24px;
      margin-top: 24px;
    }

    label {
      display: block;
      font-size: 14px;
      color: #6B7280;
      margin-top: 16px;
      margin-bottom: 6px;
    }

    input {
      width: 100%;
      padding: 10px;
      border: 1px solid #DCD8CE;
      border-radius: 6px;
      font-size: 16px;
      box-sizing: border-box;
    }

    button {
      margin-top: 20px;
      margin-right: 10px;
      padding: 10px 20px;
      border: none;
      border-radius: 6px;
      font-size: 15px;
      cursor: pointer;
    }

    #calculateBtn {
      background: #14181F;
      color: white;
    }

    #clearBtn {
      background: transparent;
      border: 1px solid #B4473E;
      color: #B4473E;
    }

    .result {
      margin-top: 24px;
      padding-top: 16px;
      border-top: 1px solid #DCD8CE;
      text-align: center;
    }

    #resultValue {
      font-size: 32px;
      color: #C98A3E;
      margin: 4px 0 0;
    }

    .history {
      margin-top: 24px;
      padding-top: 16px;
      border-top: 1px solid #DCD8CE;
    }

    .history h4 {
      margin: 0 0 10px;
      font-size: 14px;
      color: #6B7280;
    }

    #historyList {
      list-style: none;
      padding: 0;
      margin: 0 0 12px;
    }

    #historyList li {
      font-size: 14px;
      padding: 8px 10px;
      background: #F4F2EC;
      border-radius: 6px;
      margin-bottom: 6px;
    }

    #clearHistoryBtn {
      background: transparent;
      border: 1px solid #DCD8CE;
      color: #6B7280;
      font-size: 13px;
      padding: 6px 12px;
      margin: 0;
    }
  </style>
</head>
<body>

  <h1>QuickCalc</h1>
  <p>Fast answers to the math questions you actually search for.</p>

  <div class="calculator">
    <h2>Percentage Calculator</h2>

    <label for="percentValue">Percentage</label>
    <input type="number" id="percentValue" placeholder="e.g. 15">

    <label for="ofValue">Of this number</label>
    <input type="number" id="ofValue" placeholder="e.g. 230">

    <button id="calculateBtn">Calculate</button>
    <button id="clearBtn">Clear</button>

    <div class="result">
      <p>Result:</p>
      <h3 id="resultValue">—</h3>
    </div>

    <div class="history">
      <h4>History</h4>
      <ul id="historyList"></ul>
      <button id="clearHistoryBtn">Clear History</button>
    </div>
  </div>

  <script>
    function loadHistory() {
      var history = JSON.parse(localStorage.getItem('calcHistory') || '[]');
      var list = document.getElementById('historyList');
      list.innerHTML = '';

      if (history.length === 0) {
        list.innerHTML = '<li>No calculations yet</li>';
        return;
      }

      history.slice(0, 5).forEach(function(entry) {
        var li = document.createElement('li');
        li.textContent = entry;
        list.appendChild(li);
      });
    }

    function saveToHistory(entry) {
      var history = JSON.parse(localStorage.getItem('calcHistory') || '[]');
      history.unshift(entry);
      history = history.slice(0, 10);
      localStorage.setItem('calcHistory', JSON.stringify(history));
      loadHistory();
    }

    document.getElementById('calculateBtn').addEventListener('click', function() {
      var percent = parseFloat(document.getElementById('percentValue').value);
      var ofNumber = parseFloat(document.getElementById('ofValue').value);

      if (isNaN(percent) || isNaN(ofNumber)) {
        document.getElementById('resultValue').textContent = 'Enter both numbers';
        return;
      }

      var result = (percent / 100) * ofNumber;
      document.getElementById('resultValue').textContent = result;
      saveToHistory(percent + '% of ' + ofNumber + ' = ' + result);
      document.getElementById('percentValue').value = '';
      document.getElementById('ofValue').value = '';
    });

    document.getElementById('clearBtn').addEventListener('click', function() {
      document.getElementById('percentValue').value = '';
      document.getElementById('ofValue').value = '';
      document.getElementById('resultValue').textContent = '—';
    });

    document.getElementById('clearHistoryBtn').addEventListener('click', function() {
      localStorage.removeItem('calcHistory');
      loadHistory();
    });

    loadHistory();
  </script>
</body>
</html>
