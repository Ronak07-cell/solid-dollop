<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QuickCalc — Percentage Calculator</title>
    <style>
    body {
      font-family: -apple-system, sans-serif;
      max-width: 500px;
      margin: 60px auto;
      padding: 0 20px;
      background: #F4F2EC;
      color: #1B1F27;
    }

    h1 {
      margin-bottom: 4px;
    }

    .calculator {
      background: white;
      border: 1px solid #DCD8CE;
      border-radius: 8px;
      padding: 24px;
      margin-top: 24px;
    }

    label {
      display: block;
      font-size: 14px;
      color: #6B7280;
      margin-top: 16px;
      margin-bottom: 6px;
    }

    input {
      width: 100%;
      padding: 10px;
      border: 1px solid #DCD8CE;
      border-radius: 6px;
      font-size: 16px;
      box-sizing: border-box;
    }

    button {
      margin-top: 20px;
      margin-right: 10px;
      padding: 10px 20px;
      border: none;
      border-radius: 6px;
      font-size: 15px;
      cursor: pointer;
    }

    #calculateBtn {
      background: #14181F;
      color: white;
    }

    #clearBtn {
      background: transparent;
      border: 1px solid #B4473E;
      color: #B4473E;
    }

    .result {
      margin-top: 24px;
      padding-top: 16px;
      border-top: 1px solid #DCD8CE;
      text-align: center;
    }

    #resultValue {
      font-size: 32px;
      color: #C98A3E;
      margin: 4px 0 0;
    }
  </style>
</head>
<body>

  <h1>QuickCalc</h1>
  <p>Fast answers to the math questions you actually search for.</p>

  <div class="calculator">
    <h2>Percentage Calculator</h2>

    <label for="percentValue">Percentage</label>
    <input type="number" id="percentValue" placeholder="e.g. 15">

    <label for="ofValue">Of this number</label>
    <input type="number" id="ofValue" placeholder="e.g. 230">

    <button id="calculateBtn">Calculate</button>
    <button id="clearBtn">Clear</button>

    <div class="result">
      <p>Result:</p>
      <h3 id="resultValue">—</h3>
    </div>
  </div>
  <script>
    document.getElementById('calculateBtn').addEventListener('click', function() {
      var percent = parseFloat(document.getElementById('percentValue').value);
      var ofNumber = parseFloat(document.getElementById('ofValue').value);

      if (isNaN(percent) || isNaN(ofNumber)) {
        document.getElementById('resultValue').textContent = 'Enter both numbers';
        return;
      }

      var result = (percent / 100) * ofNumber;
      document.getElementById('resultValue').textContent = result;
    });

    document.getElementById('clearBtn').addEventListener('click', function() {
      document.getElementById('percentValue').value = '';
      document.getElementById('ofValue').value = '';
      document.getElementById('resultValue').textContent = '—';
    });
  </script>
</body>
</html>
