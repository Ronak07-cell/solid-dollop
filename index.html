<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QuickCalc — Percentage Calculator</title>
</head>
<body>

  <h1>QuickCalc</h1>
  <p>Fast answers to the math questions you actually search for.</p>

  <div class="calculator">
    <h2>Percentage Calculator</h2>

    <label for="percentValue">Percentage</label>
    <input type="number" id="percentValue" placeholder="e.g. 15">

    <label for="ofValue">Of this number</label>
    <input type="number" id="ofValue" placeholder="e.g. 230">

    <button id="calculateBtn">Calculate</button>
    <button id="clearBtn">Clear</button>

    <div class="result">
      <p>Result:</p>
      <h3 id="resultValue">—</h3>
    </div>
  </div>
  <script>
    document.getElementById('calculateBtn').addEventListener('click', function() {
      var percent = parseFloat(document.getElementById('percentValue').value);
      var ofNumber = parseFloat(document.getElementById('ofValue').value);

      if (isNaN(percent) || isNaN(ofNumber)) {
        document.getElementById('resultValue').textContent = 'Enter both numbers';
        return;
      }

      var result = (percent / 100) * ofNumber;
      document.getElementById('resultValue').textContent = result;
    });

    document.getElementById('clearBtn').addEventListener('click', function() {
      document.getElementById('percentValue').value = '';
      document.getElementById('ofValue').value = '';
      document.getElementById('resultValue').textContent = '—';
    });
  </script>
</body>
</html>
