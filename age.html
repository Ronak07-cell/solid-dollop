  <h1>Age Calculator</h1>
  <p class="tagline">Find your exact age in years, months, and days.</p>

  <div class="calculator">
    <label for="birthDate">Your Date of Birth</label>
    <input type="date" id="birthDate">

    <button id="calculateBtn">Calculate</button>
    <button id="clearBtn">Clear</button>

    <div class="result">
      <p>Your Age:</p>
      <h3 id="resultValue">—</h3>
      <div id="daysValue"></div>
    </div>

    <div class="history">
      <h4>History</h4>
      <ul id="historyList"></ul>
      <button id="clearHistoryBtn">Clear History</button>
    </div>
  </div>

  <footer>

    <a href="contact.html">Contact</a> ·
    <a href="privacy.html">Privacy Policy</a>
  </footer>

  <script>
    var STORAGE_KEY = 'ageHistory';

    function loadHistory() {
      var history = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
      var list = document.getElementById('historyList');
      list.innerHTML = '';
      if (history.length === 0) {
        list.innerHTML = '<li>No calculations yet</li>';
        return;
      }
      history.slice(0, 5).forEach(function(entry) {
        var li = document.createElement('li');
        li.textContent = entry;
        list.appendChild(li);
      });
    }

    function saveToHistory(entry) {
      var history = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
      history.unshift(entry);
      history = history.slice(0, 10);
      localStorage.setItem(STORAGE_KEY, JSON.stringify(history));
      loadHistory();
    }

    document.getElementById('calculateBtn').addEventListener('click', function() {
      var birthInput = document.getElementById('birthDate').value;

      if (!birthInput) {
        document.getElementById('resultValue').textContent = 'Pick a date';
        document.getElementById('daysValue').textContent = '';
        return;
      }

      var birth = new Date(birthInput);
      var today = new Date();

      var years = today.getFullYear() - birth.getFullYear();
      var months = today.getMonth() - birth.getMonth();
      var days = today.getDate() - birth.getDate();

      if (days < 0) {
        months = months - 1;
        var prevMonth = new Date(today.getFullYear(), today.getMonth(), 0);
        days = days + prevMonth.getDate();
      }

      if (months < 0) {
        years = years - 1;
        months = months + 12;
      }

      var totalDays = Math.floor((today - birth) / (1000 * 60 * 60 * 24));

      document.getElementById('resultValue').textContent = years + ' years, ' + months + ' months, ' + days + ' days';
      document.getElementById('daysValue').textContent = 'Total: ' + totalDays + ' days alive';
      saveToHistory('Born ' + birthInput + ' → ' + years + 'y ' + months + 'm ' + days + 'd');
    });

    document.getElementById('clearBtn').addEventListener('click', function() {
      document.getElementById('birthDate').value = '';
      document.getElementById('resultValue').textContent = '—';
      document.getElementById('daysValue').textContent = '';
    });

    document.getElementById('clearHistoryBtn').addEventListener('click', function() {
      localStorage.removeItem(STORAGE_KEY);
      loadHistory();
    });

    loadHistory();
  </script>
</body>
